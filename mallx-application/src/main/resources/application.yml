server:
  tomcat:
    # 被拒绝的上传仍需有限地排空请求体，避免6MB附近的请求在客户端收到JSON前被重置。
    # 这不是上传许可：实际仍限单文件5MB、整个请求6MB；不设-1无限吞入以免资源滥用。
    max-swallow-size: 8MB

spring:
  application:
    name: mallx-application
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://${mall.db.host}:3306/${mall.db.name:mall}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: root
    password: ${mall.db.pw}
  data:
    redis:
      host: ${mall.redis.host:localhost}
      port: ${mall.redis.port:6379}
      # 密码为空时，不设置密码。
      password: ${mall.redis.pw:}
      database: ${mall.redis.db:0}
  rabbitmq:
    host: ${mall.mq.host:localhost}
    port: ${mall.mq.port:5672}
    username: ${mall.mq.username:guest}
    password: ${mall.mq.pw:guest}

mallx:
  aliyun:
    oss:
      endpoint: ${mall.oss.endpoint:}
      bucket-name: ${mall.oss.bucket-name:}
      region: ${mall.oss.region:}
      # 留空使用私有Bucket限时签名链接；填写需事先配置公开图片域名/CDN访问权限。
      public-base-url: ${mall.oss.public-base-url:}
      signed-url-seconds: ${mall.oss.signed-url-seconds:900}
      # 阿里云 OSS 的访问凭证不要填写在此文件中，请使用环境变量：
      # OSS_ACCESS_KEY_ID=
      # OSS_ACCESS_KEY_SECRET=

# Sa-Token 的基础会话策略；登录态存储由 sa-token-redis-jackson 接入 Redis。
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: 1800
  is-concurrent: true
  max-login-count: 5
  is-share: false
  token-style: uuid
  is-log: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id


# 日志目录默认为父项目运行目录下的 ./logs；本机可通过 LOG_PATH 覆盖。
logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    root: INFO
